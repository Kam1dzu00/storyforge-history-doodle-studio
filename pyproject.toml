[project]
name = "history-doodle-studio"
version = "1.0.0"
description = "Local Apple Silicon history explainer video factory"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6>=6.8,<7",
  "pydantic>=2.10,<3",
  "mlx-lm>=0.28",
  "mlx-whisper>=0.4",
  "mflux>=0.15",
  "kokoro>=0.9.4",
  "soundfile>=0.13",
  "numpy>=2.0",
  "Pillow>=11",
  "huggingface-hub>=0.30",
  "psutil>=7",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6"]

[project.scripts]
history-doodle = "history_doodle.app:main"
history-doodle-cli = "history_doodle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/history_doodle"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

